schemaVersion: "1"
name: "App: change of address"
description: The client gives a new address with proof; the team checks it before the profile changes.
caseTitle: "Address change: {{applicant}}"
inputs: []
steps:
  - { id: start, name: Start, type: start, events: [{ name: finished, outputs: [], next: [form] }] }
  - id: form
    name: New address
    type: client.screen
    config:
      title: Where do you live now?
      description: "Your current address: {{me.address}}"
      stage: details
      fields:
        - { key: newAddress, label: New address, type: textarea, required: true, placeholder: "Street, city, postcode" }
        - { key: movedOn, label: Date you moved, type: date, required: true }
        - { key: proof, label: Proof of address (utility bill or bank statement, less than 3 months old), type: file, required: true }
      buttons: [{ key: continue, label: Send for checking, style: primary }]
    events: [{ name: continue, outputs: [], next: [review] }]
  - id: review
    name: Check the proof
    type: review
    config:
      title: "Address change: {{case.applicant.name}}"
      description: "New address: {{input.newAddress}} (moved on {{input.movedOn}}). Check the proof of address."
      assignTo: { role: reviewer }
      sla: P2D
      outcomes: [{ key: accept, label: Accept the new address }, { key: decline, label: Decline, requiresReason: true }]
    events: [{ name: accept, outputs: [], next: [profile] }, { name: decline, outputs: [], next: [sorry] }]
  - id: profile
    name: Update profile
    type: client.profile
    config: { attributes: { address: "{{input.newAddress}}" } }
    events: [{ name: done, outputs: [], next: [notify] }]
  - id: notify
    name: Tell the client
    type: client.notify
    config: { title: "Address updated", body: "We now have {{input.newAddress}} as your address.", tone: success, page: profile }
    events: [{ name: done, outputs: [], next: [done] }]
  - id: done
    name: Done
    type: case.decision
    config: { status: completed, outcome: address_changed, notifyApplicant: false }
    isTerminal: true
    events: [{ name: done, outputs: [], next: [] }]
  - id: sorry
    name: Declined
    type: client.notify
    config: { title: "We could not change your address", body: "{{steps.review.reason}}", tone: warning }
    events: [{ name: done, outputs: [], next: [closed] }]
  - id: closed
    name: Closed
    type: case.decision
    config: { status: closed, outcome: address_not_changed, notifyApplicant: false }
    isTerminal: true
    events: [{ name: done, outputs: [], next: [] }]
