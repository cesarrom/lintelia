schemaVersion: "1"
name: "App: move money"
description: Moves money between the client's own accounts and records both transactions.
caseTitle: "Transfer: {{applicant}}"
inputs: []
steps:
  - { id: start, name: Start, type: start, events: [{ name: finished, outputs: [], next: [accounts] }] }
  - id: accounts
    name: Accounts
    type: client.data
    config: { collection: accounts, filter: 'type in ["current", "savings"] and status = "active"' }
    events: [{ name: done, outputs: [], next: [form] }]
  - id: form
    name: Transfer details
    type: client.screen
    config:
      title: Move money between your accounts
      stage: details
      fields:
        - { key: fromAccount, label: From, type: select, required: true, optionsFrom: accounts, optionFilter: 'type in ["current", "savings"] and status = "active"', optionLabel: "{{item.name}} · £{{item.balance | money}}", optionValue: "{{item.key}}" }
        - { key: toAccount, label: To, type: select, required: true, optionsFrom: accounts, optionFilter: 'type in ["current", "savings"] and status = "active"', optionLabel: "{{item.name}} · £{{item.balance | money}}", optionValue: "{{item.key}}" }
        - { key: amount, label: Amount, type: money, required: true, min: 0.01 }
        - { key: reference, label: Reference, type: text, placeholder: "e.g. Rent" }
      buttons: [{ key: continue, label: Review transfer, style: primary }]
    events: [{ name: continue, outputs: [], next: [check] }]
  - id: check
    name: Check
    type: calculate
    config:
      outputs:
        from: "$number(steps.accounts.records[key = $$.input.fromAccount].balance)"
        to: "$number(steps.accounts.records[key = $$.input.toAccount].balance)"
        fromName: "steps.accounts.records[key = $$.input.fromAccount].name"
        toName: "steps.accounts.records[key = $$.input.toAccount].name"
        amount: "$round($number(input.amount), 2)"
        same: "input.fromAccount = input.toAccount"
        valid: "input.fromAccount != input.toAccount and $number(input.amount) > 0 and $number(input.amount) <= $number(steps.accounts.records[key = $$.input.fromAccount].balance)"
    events: [{ name: done, outputs: [], next: [valid] }]
  - id: valid
    name: Possible?
    type: conditional
    config: { expression: "steps.check.valid" }
    events: [{ name: "true", outputs: [], next: [confirm] }, { name: "false", outputs: [], next: [problem] }]
  - id: problem
    name: Not possible
    type: client.screen
    config:
      title: We can't make this transfer
      content: "= steps.check.same ? 'Choose two different accounts.' : 'The amount is more than the £' & $formatNumber(steps.check.from, '#,##0.00') & ' available in your ' & steps.check.fromName & '.'"
      stage: details
      buttons: [{ key: back, label: Change the transfer, style: primary, skipValidation: true }]
    events: [{ name: back, outputs: [], next: [form] }]
  - id: confirm
    name: Confirm
    type: client.screen
    config:
      title: Confirm your transfer
      stage: confirm
      content: "**£{{steps.check.amount | money}}** from **{{steps.check.fromName}}** to **{{steps.check.toName}}**\n\nThe money arrives straight away."
      buttons: [{ key: move, label: Move money, style: primary }, { key: back, label: Back, style: secondary, skipValidation: true }]
    events: [{ name: move, outputs: [], next: [debit] }, { name: back, outputs: [], next: [form] }]
  - id: debit
    name: Debit
    type: client.record
    config: { collection: accounts, key: "{{input.fromAccount}}", mode: merge, data: { balance: "= $round(steps.check.from - steps.check.amount, 2)" } }
    events: [{ name: done, outputs: [], next: [credit] }]
  - id: credit
    name: Credit
    type: client.record
    config: { collection: accounts, key: "{{input.toAccount}}", mode: merge, data: { balance: "= $round(steps.check.to + steps.check.amount, 2)" } }
    events: [{ name: done, outputs: [], next: [tx_out] }]
  - id: tx_out
    name: Transaction out
    type: client.record
    config:
      collection: transactions
      key: "= 'tx-' & case.reference & '-out'"
      mode: upsert
      data: { account: "{{input.fromAccount}}", date: "= $now()", description: "= 'To ' & steps.check.toName & ($exists(input.reference) and input.reference != '' ? ' · ' & input.reference : '')", amount: "= -steps.check.amount", currency: GBP, category: Transfers, status: posted }
    events: [{ name: done, outputs: [], next: [tx_in] }]
  - id: tx_in
    name: Transaction in
    type: client.record
    config:
      collection: transactions
      key: "= 'tx-' & case.reference & '-in'"
      mode: upsert
      data: { account: "{{input.toAccount}}", date: "= $now()", description: "= 'From ' & steps.check.fromName & ($exists(input.reference) and input.reference != '' ? ' · ' & input.reference : '')", amount: "= steps.check.amount", currency: GBP, category: Transfers, status: posted }
    events: [{ name: done, outputs: [], next: [notify] }]
  - id: notify
    name: Tell the client
    type: client.notify
    config: { title: "Money moved", body: "£{{steps.check.amount | money}} is now in your {{steps.check.toName}}.", tone: success, page: accounts }
    events: [{ name: done, outputs: [], next: [done] }]
  - id: done
    name: Done
    type: case.decision
    config: { status: completed, outcome: transferred, notifyApplicant: false }
    isTerminal: true
    events: [{ name: done, outputs: [], next: [] }]
