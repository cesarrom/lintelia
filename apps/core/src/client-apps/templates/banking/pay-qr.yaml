schemaVersion: "1"
name: "App: pay with a QR code"
description: Pays a shop or a person by scanning their payment QR code (EMV, as Pix and most pay-by-QR schemes); codes with an amount continue by themselves.
caseTitle: "QR payment: {{applicant}}"
inputs: []
steps:
  - { id: start, name: Start, type: start, events: [{ name: finished, outputs: [], next: [accounts] }] }
  - id: accounts
    name: Accounts
    type: client.data
    config: { collection: accounts, filter: 'type = "current" and status = "active"' }
    events: [{ name: done, outputs: [], next: [scan] }]
  - id: scan
    name: Scan the code
    type: client.screen
    config:
      title: Scan to pay
      description: Point your camera at the shop's payment QR code, or use a photo of it.
      stage: scan
      fields:
        - { key: code, label: Payment code, type: scan, scanCodes: qr, parse: emv, required: true }
        - { key: amount, label: Amount to pay, type: money, required: true, min: 0.01, visibleIf: "codeDetails.valid and $not($exists(codeDetails.amount))", help: This code lets you choose the amount. }
        - { key: note, label: Note for you, type: text, width: half, placeholder: "e.g. Lunch", visibleIf: "codeDetails.valid" }
        - { key: category, label: Category, type: select, width: half, visibleIf: "codeDetails.valid", options: [Groceries, Dining out, Shopping, Transport, Other] }
      buttons: [{ key: continue, label: Continue, style: primary }, { key: cancel, label: Cancel, style: secondary, skipValidation: true }]
      # A code that carries its amount needs nothing else: go on after a short countdown the client can stop.
      autoSubmit: { button: continue, when: expression, expression: "codeDetails.valid and $exists(codeDetails.amount)", delay: 2 }
    events: [{ name: continue, outputs: [], next: [check] }, { name: cancel, outputs: [], next: [cancelled] }]
  - id: check
    name: Check
    type: calculate
    config:
      outputs:
        account: "steps.accounts.records[0].key"
        accountName: "steps.accounts.records[0].name"
        balance: "$number(steps.accounts.records[0].balance)"
        payee: "$exists(input.codeDetails.payee) ? input.codeDetails.payee : 'the payee'"
        place: "$exists(input.codeDetails.city) ? ', ' & input.codeDetails.city : ''"
        amount: "$round($exists(input.codeDetails.amount) ? input.codeDetails.amount : $number(input.amount), 2)"
        currency: "$exists(input.codeDetails.currency) ? input.codeDetails.currency : 'GBP'"
        reference: "$exists(input.codeDetails.reference) ? input.codeDetails.reference : ''"
        problem: >-
          $count(steps.accounts.records) = 0 ? 'You need a current account to pay with a QR code.'
          : ($exists(input.codeDetails.currency) and input.codeDetails.currency != 'GBP') ? 'This code asks for a payment in ' & input.codeDetails.currency & '; your account is in pounds.'
          : ($round($exists(input.codeDetails.amount) ? input.codeDetails.amount : $number(input.amount), 2) > $number(steps.accounts.records[0].balance)) ? 'The amount is more than the £' & $formatNumber($number(steps.accounts.records[0].balance), '#,##0.00') & ' in your ' & steps.accounts.records[0].name & '.'
          : ''
    events: [{ name: done, outputs: [], next: [possible] }]
  - id: possible
    name: Possible?
    type: conditional
    config: { expression: "steps.check.problem = ''" }
    events: [{ name: "true", outputs: [], next: [confirm] }, { name: "false", outputs: [], next: [problem] }]
  - id: problem
    name: Not possible
    type: client.screen
    config:
      title: We can't make this payment
      content: "= steps.check.problem"
      stage: scan
      buttons: [{ key: again, label: Scan another code, style: primary, skipValidation: true }, { key: cancel, label: Cancel, style: secondary, skipValidation: true }]
    events: [{ name: again, outputs: [], next: [scan] }, { name: cancel, outputs: [], next: [cancelled] }]
  - id: confirm
    name: Confirm
    type: client.screen
    config:
      title: "Pay {{steps.check.payee}}"
      stage: confirm
      content: "**£{{steps.check.amount | money}}** to **{{steps.check.payee}}**{{steps.check.place}}\n\nFrom your {{steps.check.accountName}}. The money leaves your account straight away."
      buttons: [{ key: pay, label: Pay now, style: primary }, { key: back, label: Scan again, style: secondary, skipValidation: true }]
    events: [{ name: pay, outputs: [], next: [debit] }, { name: back, outputs: [], next: [scan] }]
  - id: debit
    name: Debit
    type: client.record
    config: { collection: accounts, key: "{{steps.check.account}}", mode: merge, data: { balance: "= $round(steps.check.balance - steps.check.amount, 2)" } }
    events: [{ name: done, outputs: [], next: [transaction] }]
  - id: transaction
    name: Transaction
    type: client.record
    config:
      collection: transactions
      key: "= 'tx-' & case.reference"
      mode: upsert
      data: { account: "{{steps.check.account}}", date: "= $now()", description: "= steps.check.payee & ($exists(input.note) and input.note != '' ? ' · ' & input.note : '')", amount: "= -steps.check.amount", currency: GBP, category: "= $exists(input.category) and input.category != '' ? input.category : 'Payments'", status: posted, reference: "= steps.check.reference", channel: qr }
    events: [{ name: done, outputs: [], next: [notify] }]
  - id: notify
    name: Tell the client
    type: client.notify
    config: { title: "Paid {{steps.check.payee}}", body: "£{{steps.check.amount | money}} from your {{steps.check.accountName}}.", tone: success, page: accounts }
    events: [{ name: done, outputs: [], next: [done] }]
  - id: done
    name: Done
    type: case.decision
    config: { status: completed, outcome: paid, notifyApplicant: false }
    isTerminal: true
    events: [{ name: done, outputs: [], next: [] }]
  - id: cancelled
    name: Cancelled
    type: case.decision
    config: { status: withdrawn, outcome: cancelled, notifyApplicant: false }
    isTerminal: true
    events: [{ name: done, outputs: [], next: [] }]
